<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AbbyBunnyCat 的深夜樹洞圖書館 🦉🪵✨</title>
    
    <!-- Open Graph 標籤 -->
    <meta property="og:title" content="AbbyBunnyCat 的深夜樹洞圖書館 🦉🪵✨">
    <meta property="og:description" content="歡迎來到溫暖黃燈與木頭香氣的深夜樹洞圖書館，和森林小動物一起探索心靈與智慧吧！">
    <meta property="og:type" content="website">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

        :root {
            --bg-dark: #121614;
            --bg-tree: #1a221e;
            --wood-primary: #8d5b4c;
            --wood-light: #a9715f;
            --wood-card: rgba(30, 38, 33, 0.85);
            --wood-card-hover: rgba(42, 53, 46, 0.95);
            --amber-glow: #f59e0b;
            --text-main: #f3f4f6;
            --text-sub: #b2bba8;
            --border-wood: #5a3d31;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Zen Maru Gothic', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: radial-gradient(circle at 50% 20%, #222e26 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            padding: 50px 20px 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 森林深夜微光與營火效果 */
        .forest-ambience {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        /* 螢火蟲外層負責漂浮路徑 */
        .firefly-wrap {
            position: absolute;
            animation: floatFirefly var(--float-dur, 18s) infinite alternate ease-in-out;
        }

        /* 螢火蟲內層負責一閃一閃呼吸光暈 */
        .firefly {
            display: block;
            width: var(--size, 5px);
            height: var(--size, 5px);
            background: var(--core-color, #fef08a);
            border-radius: 50%;
            box-shadow: 
                0 0 8px var(--glow-color, #f59e0b),
                0 0 18px var(--glow-color, #f59e0b),
                0 0 28px rgba(253, 224, 71, 0.45);
            animation: twinkle var(--twinkle-dur, 2.5s) infinite ease-in-out;
            animation-delay: var(--twinkle-delay, 0s);
        }

        @keyframes floatFirefly {
            0% {
                transform: translate(0, 0);
            }
            33% {
                transform: translate(var(--dx1, 45px), var(--dy1, -55px));
            }
            66% {
                transform: translate(var(--dx2, -35px), var(--dy2, -100px));
            }
            100% {
                transform: translate(var(--dx3, 25px), var(--dy3, -40px));
            }
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.08;
                transform: scale(0.6);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        /* 頂部層級 */
        header, .control-panel, main, footer {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1140px;
        }

        /* 圖書館招牌區 */
        header {
            text-align: center;
            margin-bottom: 35px;
        }

        .library-badge {
            display: inline-block;
            background: rgba(141, 91, 76, 0.3);
            color: #fde047;
            font-size: 0.88rem;
            font-weight: 700;
            padding: 6px 18px;
            border-radius: 999px;
            border: 1.5px solid var(--wood-light);
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.15);
        }

        header h1 {
            color: #fde68a;
            font-size: 2.6rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(245, 158, 11, 0.4), 0 4px 20px rgba(0,0,0,0.8);
            letter-spacing: 1.5px;
        }

        header p {
            color: var(--text-sub);
            font-size: 1.05rem;
            letter-spacing: 0.5px;
        }

        /* 互動控制列：木質書櫃搜尋與分類 */
        .control-panel {
            background: rgba(30, 38, 33, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border-wood);
            border-radius: 24px;
            padding: 20px 24px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
        }

        .filter-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tab-btn {
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-sub);
            background: rgba(18, 22, 20, 0.8);
            border: 2px solid #36453b;
            padding: 8px 18px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            border-color: var(--amber-glow);
            color: #fde68a;
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #b45309, #d97706);
            color: #ffffff;
            border-color: #f59e0b;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
        }

        .search-box {
            position: relative;
            flex: 1 1 240px;
            max-width: 300px;
        }

        .search-box input {
            width: 100%;
            font-family: inherit;
            font-size: 0.92rem;
            color: #ffffff;
            background: rgba(18, 22, 20, 0.9);
            border: 2px solid #36453b;
            border-radius: 999px;
            padding: 10px 18px 10px 40px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .search-box input:focus {
            border-color: var(--amber-glow);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2);
        }

        .search-box span {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.95rem;
        }

        /* 分類區塊（樹洞書架） */
        .category-section {
            margin-bottom: 50px;
            transition: opacity 0.3s ease;
        }

        .category-section.hidden {
            display: none;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
            border-bottom: 2px dashed rgba(141, 91, 76, 0.4);
            padding-bottom: 10px;
        }

        .category-title {
            font-size: 1.4rem;
            font-weight: 900;
            color: #fde68a;
            background: rgba(30, 38, 33, 0.9);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 22px;
            border-radius: 999px;
            border: 2px solid var(--wood-light);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .count-pill {
            font-size: 0.85rem;
            font-weight: 900;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.15);
            padding: 4px 12px;
            border-radius: 999px;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        /* 藏書網格 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 26px;
        }

        /* 木質精裝書本／卡片風格 */
        .card {
            background: var(--wood-card);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border-wood);
            border-radius: 24px;
            padding: 28px 20px 20px;
            text-decoration: none;
            color: var(--text-main);
            text-align: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card.hidden {
            display: none;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            background: var(--wood-card-hover);
            border-color: var(--amber-glow);
            box-shadow: 0 15px 35px rgba(245, 158, 11, 0.25);
        }

        .new-badge {
            position: absolute;
            top: -12px;
            right: 18px;
            background: linear-gradient(135deg, #d97706, #f59e0b);
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 999px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }

        .icon-circle {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            background: rgba(141, 91, 76, 0.25);
            border: 1.5px solid var(--wood-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            margin-bottom: 16px;
            transition: transform 0.3s ease;
        }

        .card:hover .icon-circle {
            transform: scale(1.12) rotate(6deg);
            background: rgba(245, 158, 11, 0.2);
        }

        .card h2 {
            font-size: 1.3rem;
            color: #fef08a;
            margin-bottom: 8px;
            font-weight: 900;
        }

        .card p {
            font-size: 0.9rem;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 18px;
        }

        /* 森林動物館員陪伴對話框 */
        .animal-helper {
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: rgba(18, 22, 20, 0.8);
            padding: 8px 14px;
            border-radius: 16px;
            border: 1px solid #36453b;
            width: 100%;
            text-align: left;
        }

        .animal-avatar {
            font-size: 1.5rem;
            flex-shrink: 0;
            animation: bounce 2.2s infinite ease-in-out;
        }

        .animal-dialog {
            font-size: 0.82rem;
            color: #fde68a;
            font-weight: 700;
            line-height: 1.35;
        }

        .card:hover .animal-avatar {
            animation: happyJump 0.45s infinite alternate ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @keyframes happyJump {
            0% { transform: translateY(0) rotate(-6deg); }
            100% { transform: translateY(-7px) rotate(6deg); }
        }

        /* 查無藏書提示 */
        .empty-state {
            display: none;
            text-align: center;
            padding: 50px 2
