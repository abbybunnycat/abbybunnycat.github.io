<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深夜樹洞圖書館｜AbbyBunnyCat 的森林藏書閣</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        canopy: '#132219',
                        bark: '#1E2D24',
                        timber: '#3B281E',
                        warmWood: '#5A3E2E',
                        parchment: '#F4EDE2',
                        lantern: '#F5B95A',
                        moss: '#7A9B76',
                    },
                    fontFamily: {
                        serif: ['"LXGW WenKai TC"', 'serif'],
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at top, #1d3326 0%, #132219 55%, #0d1711 100%);
            color: #F4EDE2;
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            font-size: 18px;
        }
        .treehouse-title {
            font-family: 'LXGW WenKai TC', serif;
        }
        .library-logo-badge {
            width: 124px;
            height: 124px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #7A9B76;
            padding: 5px;
            background-color: rgba(244, 237, 226, 0.95);
            box-shadow: 0 0 0 5px rgba(245, 185, 90, 0.22), 0 12px 28px rgba(0, 0, 0, 0.55);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
        }
        .library-logo-badge:hover {
            transform: scale(1.04);
            box-shadow: 0 0 0 6px rgba(245, 185, 90, 0.38), 0 14px 32px rgba(0, 0, 0, 0.65);
        }
        .wood-card {
            background: linear-gradient(165deg, rgba(59, 40, 30, 0.88) 0%, rgba(30, 45, 36, 0.92) 100%);
            border: 1px solid rgba(245, 185, 90, 0.22);
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .wood-card:hover {
            transform: translateY(-4px);
            border-color: rgba(245, 185, 90, 0.65);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.45);
        }
    </style>
</head>
<body class="antialiased selection:bg-lantern selection:text-canopy">

    <!-- 頂部樹洞圖書館迎賓區 -->
    <header class="max-w-5xl mx-auto px-5 pt-12 pb-8 text-center">
        <!-- 【Logo 放置處】館長徽章位於主標題正上方 -->
        <div class="flex justify-center mb-5">
            <img id="library-logo"
                 src="logo.png"
                 alt="AbbyBunnyCat 深夜樹洞圖書館館長徽章"
                 onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';"
                 class="library-logo-badge">
            <div id="logo-fallback"
                 class="hidden w-28 h-28 rounded-full bg-warmWood border-2 border-lantern items-center justify-center text-lantern text-3xl shadow-lg">
                <i class="fa-solid fa-tree"></i>
            </div>
        </div>

        <div class="inline-flex items-center space-x-2 bg-bark/90 border border-lantern/30 text-lantern text-sm px-4 py-1.5 rounded-full mb-4">
            <i class="fa-regular fa-moon"></i>
            <span>深夜樹洞圖書館・微光藏書與工具實驗室</span>
        </div>

        <h1 class="treehouse-title text-3xl sm:text-5xl font-bold text-parchment tracking-wide mb-3">
            AbbyBunnyCat 的森林藏書閣
        </h1>
        <p class="text-stone-300 text-base sm:text-lg max-w-2xl mx-auto leading-relaxed">
            在安靜的木造樹洞裡整理實用工具、練習與小實驗，也讓想找個安靜角落喘口氣的你，隨時推開這扇門。
        </p>
    </header>

    <!-- 主要書架／工具入口區 -->
    <main class="max-w-5xl mx-auto px-5 py-6 space-y-10">
        <section>
            <h2 class="treehouse-title text-2xl font-bold text-lantern mb-5 flex items-center">
                <i class="fa-solid fa-book-open mr-2.5 text-lg"></i>
                <span>書架與實驗室入口</span>
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 漂流日記連結卡片 -->
                <a href="blog/" class="wood-card rounded-3xl p-7 block group">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-sm font-medium text-lantern bg-canopy/70 px-3 py-1 rounded-full">
                            ✨ 生活漂流誌
                        </span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-stone-400 group-hover:text-lantern transition"></i>
                    </div>
                    <h3 class="treehouse-title text-2xl font-bold text-parchment group-hover:text-lantern transition mb-2">
                        更年期少女的奇幻漂流
                    </h3>
                    <p class="text-stone-300 text-base leading-relaxed">
                        記錄日常聚餐、放風出遊、首飾穿搭與生活小撇步，保留真實而自在的碎碎念。
                    </p>
                </a>

                <!-- 工具與專案整理卡片 -->
                <div class="wood-card rounded-3xl p-7">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-sm font-medium text-moss bg-canopy/70 px-3 py-1 rounded-full">
                            🌿 數位工作檯
                        </span>
                        <i class="fa-solid fa-wand-magic-sparkles text-lantern/80"></i>
                    </div>
                    <h3 class="treehouse-title text-2xl font-bold text-parchment mb-2">
                        個人工具與練習作品集
                    </h3>
                    <p class="text-stone-300 text-base leading-relaxed mb-4">
                        集中擺放平時動手做的網頁小工具、自動化腳本與學習紀錄，讓每次靈感都能被好好保存。
                    </p>
                    <div class="flex flex-wrap gap-2 text-sm text-parchment/90">
                        <span class="bg-canopy/80 border border-stone-600/60 px-3 py-1 rounded-lg">AI 應用練習</span>
                        <span class="bg-canopy/80 border border-stone-600/60 px-3 py-1 rounded-lg">生活小工具</span>
                        <span class="bg-canopy/80 border border-stone-600/60 px-3 py-1 rounded-lg">溫馨樹洞介面</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 頁尾 -->
    <footer class="max-w-5xl mx-auto px-5 py-10 mt-8 border-t border-stone-700/60 text-center text-sm text-stone-400">
        <p>深夜樹洞圖書館・點一盞暖燈，慢慢看、慢慢走。</p>
    </footer>

</body>
</html>
