        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

        :root {
            --bg-dark: #121614;
            --bg-tree: #1a221e;
            --wood-primary: #8d5b4c;
            --wood-light: #a9715f;
            --wood-card: rgba(30, 38, 33, 0.85);

            --border-wood: #5a3d31;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Zen Maru Gothic', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: radial-gradient(circle at 50% 20%, #222e26 0%, var(--bg-dark) 100%);

            padding: 50px 20px 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 森林深夜微光與營火效果 */
        .forest-ambience {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .firefly {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fde047;
            border-radius: 50%;
            box-shadow: 0 0 10px #f59e0b, 0 0 20px #f59e0b;
            animation: flyAround 15s infinite linear;
            opacity: 0.6;
        }

        @keyframes flyAround {
            0% { transform: translate(0, 0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translate(calc(100vw * var(--tx, 1)), calc(100vh * var(--ty, -1))); opacity: 0; }
        }

        /* 頂部層級 */
        header, .control-panel, main, footer {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1140px;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        .library-badge {
            display: inline-block;
            background: rgba(141, 91, 76, 0.3);
            color: #fde047;
            font-size: 0.88rem;
            font-weight: 700;
            padding: 6px 18px;
            border-radius: 999px;
            border: 1.5px solid var(--wood-light);
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.15);
        }

        header h1 {
            color: #fde68a;
            font-size: 2.6rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(245, 158, 11, 0.4), 0 4px 20px rgba(0,0,0,0.8);
            letter-spacing: 1.5px;
        }

        header p {
            color: var(--text-sub);
            font-size: 1.05rem;
            letter-spacing: 0.5px;
        }

        .control-panel {
            background: rgba(30, 38, 33, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border-wood);
            border-radius: 24px;
            padding: 20px 24px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
        }

        .filter-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tab-btn {
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-sub);
            background: rgba(18, 22, 20, 0.8);
            border: 2px solid #36453b;
            padding: 8px 18px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            border-color: var(--amber-glow);
            color: #fde68a;
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #b45309, #d97706);
            color: #ffffff;
            border-color: #f59e0b;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
        }
